<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{TITLE}}</title>
    <!-- KaTeX 数学公式矢量渲染样式 (内联) -->
    <style id="katex-style">
{{KATEX_CSS}}
    </style>
    <!-- 宣纸书卷雅致风格样式 (古籍宋体/水墨/赭石配色) -->
    <style>
:root {
  --bg: #f5f1e8;
  --card: #ffffff;
  --ink: #2a2520;
  --ink-light: #6b6355;
  --accent: #8b4513;
  --line: #e0d8c8;
  --water: #3a6b8b;
  --siege: #a63d3d;
  --rebel: #b86b2f;
  --bandit: #8b3a3a;
  --pacify: #3a7a5b;
  --admin: #6b6b6b;
  --essay: #8b6b3a;
}

[data-tone="pure"] {
  --bg: #fafafa;
  --card: #ffffff;
  --line: #e5e5e5;
}

[data-tone="bamboo"] {
  --bg: #f2f6f3;
  --card: #ffffff;
  --line: #d8e4dc;
  --accent: #2e694c;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Songti SC", "SimSun", "Noto Serif SC", "STSong", "Microsoft YaHei", serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.75;
  padding: 32px 20px 80px;
  padding-left: max(env(safe-area-inset-left, 0px), 20px);
  padding-right: max(env(safe-area-inset-right, 0px), 20px);
  padding-bottom: max(env(safe-area-inset-bottom, 20px), 80px);
  max-width: 1180px;
  margin: 0 auto;
  transition: background 0.2s ease;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

header {
  text-align: center;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--line);
}

h1 {
  font-size: 28px;
  letter-spacing: 2px;
  color: #3a2a1a;
  margin-bottom: 8px;
  font-weight: 700;
}

.subtitle {
  font-size: 14px;
  color: var(--ink-light);
  letter-spacing: 1px;
}

/* 顶部交互工具栏 */
.toolbar {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 22px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px 20px;
  align-items: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-label {
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 1px;
  white-space: nowrap;
}

.filter {
  font-family: inherit;
  font-size: 13px;
  padding: 5px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-light);
  cursor: pointer;
  transition: .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.filter:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.filter.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.filter .btn-icon {
  width: 14px;
  height: 14px;
  vertical-align: middle;
  flex-shrink: 0;
}

.toggle-group {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.stats {
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: .5px;
}

.stats b {
  color: var(--accent);
  font-size: 14px;
}

/* 主文档卡片 */
.content-panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 36px 48px;
  box-shadow: 0 1px 6px rgba(0,0,0,.04);
  word-wrap: break-word;
  position: relative;
}

/* 原文/译文/校勘 特殊卡片样式 */
.original {
  font-size: 14px;
  color: #3a3530;
  background: #faf7f0;
  border-left: 3px solid #d4c9b8;
  border-radius: 0 4px 4px 0;
  padding: 10px 14px;
  margin-bottom: 12px;
  line-height: 1.85;
  letter-spacing: .3px;
}

.original::before {
  content: '原';
  display: inline-block;
  font-size: 11px;
  color: #a89880;
  border: 1px solid #d4c9b8;
  border-radius: 2px;
  padding: 0 4px;
  margin-right: 8px;
  vertical-align: 1px;
}

.translation {
  font-size: 14px;
  color: #4a4540;
  line-height: 1.85;
  margin-bottom: 12px;
  letter-spacing: .3px;
}

.translation::before {
  content: '译';
  display: inline-block;
  font-size: 11px;
  color: #9ab8a0;
  border: 1px solid #b8d4be;
  border-radius: 2px;
  padding: 0 4px;
  margin-right: 8px;
  vertical-align: 1px;
}

.annotation {
  margin-top: 10px;
  padding: 10px 14px;
  background: #fdf9ec;
  border: 1px solid #efe0b8;
  border-radius: 6px;
  font-size: 13px;
  color: #7a6010;
  line-height: 1.7;
}

.annotation::before {
  content: '⚑ 校勘';
  display: block;
  font-size: 11px;
  font-weight: bold;
  color: #b8922a;
  margin-bottom: 4px;
  letter-spacing: 1px;
}

/* 标签体系 */
.card-head {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}

.date {
  font-size: 14px;
  font-weight: bold;
  color: var(--accent);
  letter-spacing: 1px;
}

.type-tag {
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 10px;
  color: #fff;
  letter-spacing: 1px;
}
.type-tag[data-t="水战"] { background: var(--water); }
.type-tag[data-t="攻城"] { background: var(--siege); }
.type-tag[data-t="民变"] { background: var(--rebel); }
.type-tag[data-t="匪患"] { background: var(--bandit); }
.type-tag[data-t="剿抚"] { background: var(--pacify); }
.type-tag[data-t="团练善后"] { background: var(--admin); }
.type-tag[data-t="方志论"] { background: var(--essay); }
.type-tag[data-t="屠戮"] { background: #6b1a1a; }

.warn-tag {
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 10px;
  background: #fdf3d8;
  color: #8a6a10;
  border: 1px solid #e8d48a;
  letter-spacing: .5px;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12.5px;
  color: var(--ink-light);
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  margin-top: 12px;
}

/* 正文 Markdown 标题排版 */
#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
  color: #3a2a1a;
  font-weight: 700;
  line-height: 1.4;
  margin-top: 26px;
  margin-bottom: 12px;
}

#content h1 {
  font-size: 24px;
  letter-spacing: 1px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--line);
}

#content h2 {
  font-size: 20px;
  letter-spacing: 0.8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}

#content h3 {
  font-size: 17px;
  color: var(--accent);
  letter-spacing: 0.5px;
}

#content h4 { font-size: 15px; }
#content h5 { font-size: 14px; }
#content h6 { font-size: 13px; color: var(--ink-light); }

#content p {
  margin-top: 0;
  margin-bottom: 14px;
  text-align: justify;
}

#content a {
  color: var(--water);
  text-decoration: none;
  border-bottom: 1px dashed var(--water);
}
#content a:hover {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

#content strong {
  font-weight: 700;
  color: #241c14;
}

#content em {
  font-style: italic;
  font-family: inherit;
}

/* 古风排版引用块 (Blockquote) */
#content blockquote {
  background: #faf7f0;
  border-left: 4px solid var(--accent);
  border-radius: 0 6px 6px 0;
  padding: 12px 18px;
  margin: 16px 0;
  color: #4a4540;
}
#content blockquote p {
  margin-bottom: 8px;
}
#content blockquote p:last-child {
  margin-bottom: 0;
}

/* 表格优雅样式 (GFM & OTSL 表格) */
.table-wrapper {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 20px 0;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
}

table {
  width: 100%;
  min-width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th {
  background: #faf7f0;
  color: var(--accent);
  font-weight: 700;
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}

td {
  padding: 9px 14px;
  border: 1px solid var(--line);
  color: var(--ink);
}

tbody tr:nth-child(even) td {
  background: #faf8f3;
}

tbody tr:hover td {
  background: #f3ece0;
}

/* 列表样式 */
#content ul, #content ol {
  padding-left: 26px;
  margin-bottom: 14px;
}

#content li {
  margin-bottom: 6px;
}

#content li::marker {
  color: var(--accent);
}

/* 行内代码与代码块 */
code:not(pre code) {
  background: #ebe4d5;
  color: #6b2a1a;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: "Fira Code", Consolas, "Courier New", monospace;
  font-size: 13px;
  word-break: break-word;
}

pre {
  background: #2a2520;
  color: #f5f1e8;
  padding: 16px 20px;
  border-radius: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 18px 0;
  border: 1px solid #4a4035;
  line-height: 1.6;
  max-width: 100%;
}

pre code {
  background: transparent;
  color: inherit;
  padding: 0;
  font-family: "Fira Code", Consolas, "Courier New", monospace;
  font-size: 13px;
}

/* KaTeX 数学公式移动端自适应与平滑横向滚动 */
.katex-display {
  overflow-x: auto;
  overflow-y: hidden;
  max-width: 100%;
  -webkit-overflow-scrolling: touch;
  padding: 8px 0;
  margin: 16px 0;
}
.katex-display > .katex {
  max-width: 100%;
  text-align: center;
}
.katex {
  max-width: 100%;
}

/* 图片居中与投影 */
#content img {
  max-width: 100%;
  height: auto;
  border-radius: 6px;
  border: 1px solid var(--line);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  margin: 14px auto;
  display: block;
}

/* 分割线 */
hr {
  border: none;
  border-top: 1px solid var(--line);
  margin: 24px 0;
}

/* LaTeX / ULEM 文本修饰 (波浪线、下划线、删除线) */
.wavy-underline, .katex .wavy-underline {
  text-decoration: underline wavy currentColor !important;
  text-decoration-skip-ink: none !important;
  text-underline-offset: 4px !important;
}
.single-underline, .katex .single-underline {
  text-decoration: underline solid currentColor !important;
  text-decoration-skip-ink: none !important;
  text-underline-offset: 3px !important;
}
.double-underline, .katex .double-underline {
  text-decoration: underline double currentColor !important;
  text-underline-offset: 3px !important;
}
.dashed-underline, .katex .dashed-underline {
  text-decoration: underline dashed currentColor !important;
}
.dotted-underline, .katex .dotted-underline {
  text-decoration: underline dotted currentColor !important;
}
.strikethrough-line, .katex .strikethrough-line {
  text-decoration: line-through solid currentColor !important;
}

/* 复制反馈气泡 */
.toast {
  position: fixed;
  bottom: 30px;
  bottom: max(env(safe-area-inset-bottom, 20px), 30px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(42, 37, 32, 0.92);
  color: #f5f1e8;
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 13px;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 9999;
  max-width: 90vw;
  text-align: center;
  box-sizing: border-box;
}
.toast.show {
  opacity: 1;
}

/* ==========================================
   悬浮文档目录组件 (屏幕左下方)
   ========================================== */
.toc-container {
  position: fixed;
  left: max(env(safe-area-inset-left, 0px) + 24px, 24px);
  bottom: max(env(safe-area-inset-bottom, 0px) + 24px, 24px);
  z-index: 999;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

.toc-fab {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 9px 16px;
  border-radius: 24px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(42, 37, 32, 0.12), 0 1px 3px rgba(0,0,0,0.06);
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.5px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

.toc-fab:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(139, 69, 19, 0.18), 0 2px 6px rgba(0,0,0,0.08);
}

.toc-fab:active {
  transform: translateY(0);
}

.toc-fab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
  box-shadow: 0 6px 20px rgba(139, 69, 19, 0.28);
}

.toc-fab.active .toc-fab-badge {
  background: rgba(255, 255, 255, 0.25);
  color: #ffffff;
}

.toc-fab-badge {
  font-size: 11px;
  font-weight: 600;
  background: rgba(139, 69, 19, 0.1);
  color: var(--accent);
  padding: 1px 6px;
  border-radius: 10px;
  line-height: 1.3;
}

/* 目录展开面板 */
.toc-panel {
  position: absolute;
  left: 0;
  bottom: calc(100% + 12px);
  width: 320px;
  max-width: calc(100vw - 48px);
  max-height: min(65vh, 520px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 12px 36px rgba(42, 37, 32, 0.16), 0 2px 8px rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px) scale(0.96);
  transform-origin: left bottom;
  transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

.toc-panel.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.toc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.015);
}

.toc-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.5px;
}

.toc-close-btn {
  background: transparent;
  border: none;
  color: var(--ink-light);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  outline: none;
}

.toc-close-btn:hover {
  color: var(--accent);
  background: rgba(0, 0, 0, 0.05);
}

.toc-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 6px;
  scroll-behavior: smooth;
}

/* 自定义优美细滚动条 */
.toc-body::-webkit-scrollbar {
  width: 5px;
}
.toc-body::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 3px;
}
.toc-body::-webkit-scrollbar-thumb:hover {
  background: var(--ink-light);
}

/* 目录项层级样式 */
.toc-item {
  display: block;
  padding: 6px 10px;
  margin: 1px 0;
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink);
  text-decoration: none;
  border-radius: 6px;
  transition: all 0.15s ease;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  border-left: 2px solid transparent;
}

.toc-item:hover {
  background: rgba(139, 69, 19, 0.06);
  color: var(--accent);
}

.toc-item.active {
  background: rgba(139, 69, 19, 0.09);
  color: var(--accent);
  font-weight: 600;
  border-left-color: var(--accent);
}

.toc-item.level-1 {
  font-weight: 600;
  padding-left: 10px;
  color: var(--ink);
}

.toc-item.level-2 {
  padding-left: 22px;
  color: var(--ink-light);
  font-size: 12.5px;
}

.toc-item.level-3 {
  padding-left: 34px;
  color: var(--ink-light);
  font-size: 12px;
}

.toc-item.level-4,
.toc-item.level-5,
.toc-item.level-6 {
  padding-left: 44px;
  color: var(--ink-light);
  font-size: 12px;
}

/* 遮罩层 (移动端点击空白处关闭) */
.toc-backdrop {
  display: none;
}

/* 目标标题高亮闪烁提示 */
@keyframes headingFlashAnimation {
  0% { background-color: rgba(139, 69, 19, 0.22); border-radius: 4px; }
  100% { background-color: transparent; }
}

.heading-target-flash {
  animation: headingFlashAnimation 1.8s ease-out;
}

/* 响应式排版适配 (平板 & 中屏设备) */
@media (max-width: 768px) {
  body {
    padding: 20px 14px max(env(safe-area-inset-bottom, 20px), 64px);
    padding-left: max(env(safe-area-inset-left, 0px), 14px);
    padding-right: max(env(safe-area-inset-right, 0px), 14px);
  }
  header {
    margin-bottom: 18px;
    padding-bottom: 14px;
  }
  h1 {
    font-size: 24px;
    letter-spacing: 1px;
  }
  .toolbar {
    padding: 12px 14px;
    gap: 12px;
  }
  .toggle-group {
    margin-left: 0;
    width: 100%;
    justify-content: flex-start;
  }
  .content-panel {
    padding: 26px 20px;
    border-radius: 8px;
  }
  #content h1 { font-size: 24px; margin-top: 22px; }
  #content h2 { font-size: 21px; margin-top: 18px; }
  #content h3 { font-size: 18.5px; margin-top: 15px; }
  #content p { font-size: 16.5px; line-height: 1.8; }
  #content ul, #content ol { font-size: 16.5px; line-height: 1.8; }
  .original, .translation { font-size: 15.5px; }

  /* 悬浮目录平板端微调 */
  .toc-container {
    left: max(env(safe-area-inset-left, 0px) + 16px, 16px);
    bottom: max(env(safe-area-inset-bottom, 0px) + 20px, 20px);
  }
  .toc-panel {
    width: 320px;
    max-width: calc(100vw - 32px);
    max-height: min(70vh, 480px);
  }
}

/* 移动手机专享适配 (iPhone / Android 屏幕 <= 480px，字号增大增强阅读体验) */
@media (max-width: 480px) {
  body {
    padding: 14px 10px max(env(safe-area-inset-bottom, 20px), 64px);
    padding-left: max(env(safe-area-inset-left, 0px), 10px);
    padding-right: max(env(safe-area-inset-right, 0px), 10px);
    line-height: 1.8;
  }
  header {
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom-width: 1px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .toolbar {
    padding: 10px 10px;
    gap: 10px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .filter-group {
    width: 100%;
    display: flex;
    gap: 6px;
  }
  .filter-label {
    display: none; /* 手机端隐藏前缀提示，释放横向空间 */
  }
  .filter {
    flex: 1 1 0;
    min-width: 0;
    padding: 8px 6px;
    font-size: 13px;
    border-radius: 12px;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
  }
  .filter .btn-icon {
    width: 14px;
    height: 14px;
  }
  .toggle-group {
    width: 100%;
    justify-content: center;
  }
  .stats {
    font-size: 12.5px;
    text-align: center;
  }
  .stats b {

  .content-panel {

  #content h1 {

  #content h5, #content h6 {

  #content ul, #content ol {

  /* 悬浮目录手机端布局 (全宽底抽屉式浮层) */

    bottom: max(env(safe-area-inset-bottom, 0px) + 14px, 14px);
  }
  .toc-fab {
    padding: 8px 14px;
    font-size: 13px;
    gap: 6px;
  }
  .toc-panel {
    position: fixed;
    left: max(env(safe-area-inset-left, 0px) + 12px, 12px);
    right: max(env(safe-area-inset-right, 0px) + 12px, 12px);
    bottom: max(env(safe-area-inset-bottom, 0px) + 58px, 58px);
    width: auto;

  .toc-backdrop.open {
    display: block;

    top: 0;

  .toc-item.level-2 { padding-left: 20px; font-size: 13.5px; }
  .toc-item.level-3 { padding-left: 30px; font-size: 13px; }
}

/* 打印与另存为 PDF 纯净模式 */
@media print {
  body {
    background: #ffffff !important;
    padding: 0;
    max-width: 100%;
  }
  .toolbar, header .subtitle, .toc-container {
    display: none !important;
  }
  .content-panel {
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
  }
  header {
    border-bottom: 1px solid #000;
    margin-bottom: 18px;
    padding-bottom: 12px;
  }
  h1 {
    color: #000 !important;
  }
}
    </style>

    <!-- 内联 marked.js 编译引擎 -->
    <script id="marked-script">
{{MARKED_JS}}
    </script>
    <!-- 内联 katex.min.js 数学公式编译器 -->
    <script id="katex-script">
{{KATEX_JS}}
    </script>
    <!-- 共享 Markdown 与公式渲染引擎 (内联) -->
    <script id="render-script">
{{RENDER_JS}}
    </script>
</head>
<body>
    <header>
        <h1>{{TITLE}}</h1>
        <div class="subtitle">LinguaAlpaca 文档解析结果 · 视觉与结构化重构</div>
    </header>

    <div class="toolbar">
        <div class="filter-group">
            <span class="filter-label">快捷操作：</span>
            <button class="filter" id="btnCopyMd" onclick="copyRawMarkdown()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span>复制 Markdown</span>
            </button>
            <button class="filter" id="btnPrint" onclick="window.print()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                <span>打印 / PDF</span>
            </button>
            <button class="filter" id="btnTheme" onclick="cyclePaperTone()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.7 1.7-1.7h2c3 0 5.5-2.5 5.5-5.5C22 6 17.5 2 12 2z"></path><circle cx="7.5" cy="11.5" r="1.5" fill="currentColor"></circle><circle cx="12" cy="7.5" r="1.5" fill="currentColor"></circle><circle cx="16.5" cy="11.5" r="1.5" fill="currentColor"></circle></svg>
                <span>切换纸色</span>
            </button>
        </div>
        <div class="toggle-group">
            <div class="stats">
                共 <b>{{CHAR_COUNT}}</b> 字符 ｜ 导出时间：<span>{{TIME}}</span>
            </div>
        </div>
    </div>

    <main class="content-panel">
        <div id="content">{{RENDERED_CONTENT}}</div>
    </main>

    <div class="toast" id="toastBox">提示信息</div>

    <!-- 悬浮文档目录组件 (屏幕左下方) -->
    <div class="toc-container" id="tocContainer" style="display: none;">
        <!-- 遮罩层 (手机端点击空白处关闭) -->
        <div class="toc-backdrop" id="tocBackdrop" onclick="toggleToc(false)"></div>

        <!-- 目录展开面板 -->
        <div class="toc-panel" id="tocPanel">
            <div class="toc-header">
                <div class="toc-title">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    <span>文档目录</span>
                </div>
                <button class="toc-close-btn" onclick="toggleToc(false)" title="关闭目录" aria-label="关闭目录">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="toc-body" id="tocBody">
                <!-- 由 JavaScript 动态插入目录列表项 -->
            </div>
        </div>

        <!-- 悬浮触发按钮 (FAB) -->
        <button class="toc-fab" id="tocFab" onclick="toggleToc()" title="查看文档目录" aria-label="查看文档目录">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            <span class="toc-fab-text">目录</span>
            <span class="toc-fab-badge" id="tocBadge">0</span>
        </button>
    </div>

    <script>
        var rawMarkdown = {{RAW_MARKDOWN_JSON}};

        function showToast(msg) {
            var box = document.getElementById('toastBox');
            if (!box) return;
            box.innerText = msg;
            box.classList.add('show');
            setTimeout(function() {
                box.classList.remove('show');
            }, 2000);
        }

        function copyRawMarkdown() {
            if (!rawMarkdown) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(rawMarkdown).then(function() {
                    showToast("Markdown 原文已成功复制到剪贴板！");
                }).catch(function() {
                    fallbackCopy(rawMarkdown);
                });
            } else {
                fallbackCopy(rawMarkdown);
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            ta.style.fontSize = "16px";
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            if (ta.setSelectionRange) {
                ta.setSelectionRange(0, 999999);
            }
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    showToast("Markdown 原文已成功复制到剪贴板！");
                } else {
                    showToast("复制失败，请手动选取。");
                }
            } catch (err) {
                showToast("复制失败，请手动选取。");
            }
            document.body.removeChild(ta);
        }

        // 宣纸色泽平滑切换 (古纸 / 纯白 / 晴竹)
        var currentToneIndex = 0;
        var toneList = ["", "pure", "bamboo"];
        var toneNames = ["宣纸素雅", "纯白明洁", "晴竹淡绿"];

        function cyclePaperTone() {
            currentToneIndex = (currentToneIndex + 1) % toneList.length;
            var t = toneList[currentToneIndex];
            if (t) {
                document.documentElement.setAttribute('data-tone', t);
            } else {
                document.documentElement.removeAttribute('data-tone');
            }
            showToast("已切换底色为：" + toneNames[currentToneIndex]);
        }

        // ==========================================
        // 智能目录生成器与悬浮调度 (JavaScript 动态解析标题)
        // ==========================================
        var isTocOpen = false;
        var headingElements = [];
        var tocObserver = null;

        function getCleanHeadingText(h) {
            var clone = h.cloneNode(true);
            var mathmls = clone.querySelectorAll('.katex-mathml');
            for (var i = 0; i < mathmls.length; i++) {
                mathmls[i].remove();
            }
            var txt = (clone.innerText || clone.textContent || '').trim();
            return txt.replace(/\s+/g, ' ');
        }

        function initTableOfContents() {
            var contentEl = document.getElementById('content');
            var tocContainer = document.getElementById('tocContainer');
            var tocBody = document.getElementById('tocBody');
            var tocBadge = document.getElementById('tocBadge');
            if (!contentEl || !tocContainer || !tocBody) return;

            var headings = contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6');
            if (!headings || headings.length === 0) {
                tocContainer.style.display = 'none';
                return;
            }

            headingElements = Array.prototype.slice.call(headings);
            tocBody.innerHTML = '';

            headingElements.forEach(function(h, idx) {
                if (!h.id) {
                    h.id = 'heading-sec-' + (idx + 1);
                }
                var level = parseInt(h.tagName.substring(1), 10) || 1;
                var text = getCleanHeadingText(h) || ('章节 ' + (idx + 1));

                var a = document.createElement('a');
                a.href = '#' + h.id;
                a.className = 'toc-item level-' + level;
                a.title = text;
                a.innerText = text;
                a.setAttribute('data-target-id', h.id);

                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    var targetId = this.getAttribute('data-target-id');
                    var targetEl = document.getElementById(targetId);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        targetEl.classList.remove('heading-target-flash');
                        void targetEl.offsetWidth; // 触发 reflow 重置动画
                        targetEl.classList.add('heading-target-flash');
                        setTimeout(function() {
                            targetEl.classList.remove('heading-target-flash');
                        }, 1800);
                        setActiveTocItem(targetId);
                    }
                    // 移动端点击后自动折叠面板以露出内容
                    if (window.innerWidth <= 768) {
                        toggleToc(false);
                    }
                });

                tocBody.appendChild(a);
            });

            if (tocBadge) {
                tocBadge.innerText = headingElements.length;
            }
            tocContainer.style.display = 'block';

            // 设置 ScrollSpy 滚动监听，实时高亮当前处于视口顶部的章节
            setupTocScrollSpy();
        }

        function setActiveTocItem(activeId) {
            var items = document.querySelectorAll('.toc-item');
            var activeItem = null;
            for (var i = 0; i < items.length; i++) {
                if (items[i].getAttribute('data-target-id') === activeId) {
                    items[i].classList.add('active');
                    activeItem = items[i];
                } else {
                    items[i].classList.remove('active');
                }
            }
            if (activeItem && isTocOpen) {
                activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function setupTocScrollSpy() {
            if (window.IntersectionObserver) {
                if (tocObserver) {
                    tocObserver.disconnect();
                }
                tocObserver = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            setActiveTocItem(entry.target.id);
                        }
                    });
                }, {
                    rootMargin: '0px 0px -75% 0px',
                    threshold: 0
                });

                headingElements.forEach(function(h) {
                    tocObserver.observe(h);
                });
            } else {
                // 降级使用普通滚动监听
                window.addEventListener('scroll', throttle(function() {
                    var scrollPos = window.scrollY + 100;
                    var curId = '';
                    for (var i = 0; i < headingElements.length; i++) {
                        var h = headingElements[i];
                        if (h.offsetTop <= scrollPos) {
                            curId = h.id;
                        } else {
                            break;
                        }
                    }
                    if (curId) {
                        setActiveTocItem(curId);
                    }
                }, 100));
            }
        }

        function throttle(fn, delay) {
            var timer = null;
            return function() {
                var ctx = this, args = arguments;
                if (!timer) {
                    timer = setTimeout(function() {
                        fn.apply(ctx, args);
                        timer = null;
                    }, delay);
                }
            };
        }

        function toggleToc(forceState) {
            var panel = document.getElementById('tocPanel');
            var fab = document.getElementById('tocFab');
            var backdrop = document.getElementById('tocBackdrop');
            if (!panel || !fab) return;

            if (typeof forceState === 'boolean') {
                isTocOpen = forceState;
            } else {
                isTocOpen = !isTocOpen;
            }

            if (isTocOpen) {
                panel.classList.add('open');
                fab.classList.add('active');
                if (backdrop) backdrop.classList.add('open');
            } else {
                panel.classList.remove('open');
                fab.classList.remove('active');
                if (backdrop) backdrop.classList.remove('open');
            }
        }

        // 点击页面其他区域关闭目录
        document.addEventListener('click', function(e) {
            var container = document.getElementById('tocContainer');
            if (!container || !isTocOpen) return;
            if (!container.contains(e.target)) {
                toggleToc(false);
            }
        });

        // 按 ESC 键关闭目录
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && isTocOpen) {
                toggleToc(false);
            }
        });

        // 自启动渲染：若宿主已预渲染好静态 DOM 内容，则无需重复执行；仅在容器为空时执行客户端渲染兜底
        function doRender() {
            var contentEl = document.getElementById('content');
            if (!contentEl || !contentEl.innerHTML.trim()) {
                if (typeof renderMarkdown === 'function') {
                    renderMarkdown(rawMarkdown, "", false);
                }
            }
            initTableOfContents();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", doRender);
        } else {
            doRender();
        }
        window.addEventListener("load", function() {
            initTableOfContents();
        });
    </script>
</body>
</html>
